annotation: "Bridge P4b slice: the fep_lean scalar OU filter instance\n(rate=1, center=0,\
  \ diffusionVarianceRate=2, stepDuration=1,\nobservation noise variance=1) projected\
  \ deterministically to\nGNN v1 continuous linear-Gaussian syntax under contract\
  \ v0.2\nrounding. Extraction record (file:line in the fep_lean\ncheckout at the\
  \ commit recorded under Signature):\n- F one-step decay = exp(-rate*t) = exp(-1)\n\
  \  [scalar_gaussian_semigroup.lean:42-43]\n- Q one-step transition covariance =\
  \ rate^-1*(1 - exp(-2*rate*t))\n  = 1 - exp(-2) [linear_gaussian_semigroup.lean:1217-1233]\n\
  - H identity readout [gaussian_filter.lean:46-49]\n- R observation noise variance\
  \ = 1\n  [posterior_convergence.lean:38-40]\n- prior_mean = 0, prior_cov = stationary\
  \ variance = 1 (proved)\n  [smooth_reference_kernel.lean:66-68, 96-101]"
