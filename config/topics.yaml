    \end{aligned}'
- id: fep-048
  title: Sync vs Async Policy Updates
  area: FEP
  mathlib: Order.Monotone.Basic
  mathlib_status: real
  nl: 'Sync vs Async Policy Updates (FEP). Catalogue row fep-048; maturity `real` in config/topics.yaml. Natural-language
    anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Order.Monotone.Basic\nimport Mathlib.Data.Real.Basic\nimport Mathlib.Tactic\n\nnamespace FEP048\n\
    \n-- [proof strategy: add_nonneg + Monotone.comp + contraction argument via abs bounds]\n\n/-- Sync update: both components\
    \ advance together, total is nonneg. -/\ntheorem fep048_sync_nonneg (a b : ℝ) (ha : 0 ≤ a) (hb : 0 ≤ b) : 0 ≤ a + b :=\n\
    \  add_nonneg ha hb\n\n/-- Async update: sequential composition preserves monotonicity. -/\ntheorem fep048_async_mono\
    \ (f g : ℝ → ℝ) (hf : Monotone f) (hg : Monotone g) :\n    Monotone (g ∘ f) :=\n  hg.comp hf\n\n/-- Contractive map: if\
    \ f x = x, f y = y and |f x - f y| < |x - y|, then x = y. -/\ntheorem fep048_contraction_unique (f : ℝ → ℝ) (x y : ℝ)\n\
    \    (hfx : f x = x) (hfy : f y = y)\n    (hc : |f x - f y| < |x - y|) : x = y := by\n  rw [hfx, hfy] at hc\n  exact absurd\
    \ hc (lt_irrefl _)\n\n/-- Identity update is monotone (trivial sync). -/\ntheorem fep048_id_mono : Monotone (id : ℝ →\
    \ ℝ) := fun _ _ h => h\n\n/-- Sum of monotone scalar updates is monotone. -/\ntheorem fep048_add_mono (f g : ℝ → ℝ) (hf\
    \ : Monotone f) (hg : Monotone g) :\n    Monotone (fun x => f x + g x) :=\n  fun _ _ h => add_le_add (hf h) (hg h)\n\n\
    end FEP048\n"
  latex_equations:
  - '\begin{aligned}

    &(a b : \mathbb{R}) (ha : 0 \le a) (hb : 0 \le b) \\

    &0 \le a + b

    \end{aligned}'
