    \ on positive reals. -/\ntheorem fep026_log_monotone {a b : ℝ} (ha : 0 < a) (hab : a ≤ b) :\n    Real.log a ≤ Real.log\
    \ b :=\n  Real.log_le_log ha hab\n\n/-- Quotient rule for real logarithms (``log(a/b) = log a - log b``). -/\ntheorem\
    \ fep026_log_div {a b : ℝ} (ha : 0 < a) (hb : 0 < b) :\n    Real.log (a / b) = Real.log a - Real.log b :=\n  Real.log_div\
