    \ linarith\n\n/-- Helmholtz difference: ΔF = ΔU - TΔS. -/\ntheorem fep013_delta_F (U₁ U₂ T S₁ S₂ : ℝ) :\n    fep013_helmholtz\
    \ U₂ T S₂ - fep013_helmholtz U₁ T S₁ = (U₂ - U₁) - T * (S₂ - S₁) := by\n  simp only [fep013_helmholtz]; ring\n\nend FEP013\n"
