  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Exp\n\nnamespace FEP010\n\nopen Real\n\n-- [proof strategy: exp_pos\
    \ + exp_add + exp_zero to derive detailed-balance and Jarzynski-like identities]\n\n/-- Fluctuation theorem: exponentials\
    \ are always positive (Boltzmann factor). -/\ntheorem fep010_exp_pos (x : ℝ) : 0 < Real.exp x :=\n  Real.exp_pos x\n\n\
    /-- Detailed balance: exp(a) * exp(-a) = 1 (forward-backward ratio). -/\ntheorem fep010_detailed_balance (a : ℝ) : Real.exp\
    \ a * Real.exp (-a) = 1 := by\n  rw [← Real.exp_add, add_neg_cancel, Real.exp_zero]\n\n/-- Jarzynski-like: exp is multiplicative\
    \ under path composition. -/\ntheorem fep010_exp_add (a b : ℝ) : Real.exp (a + b) = Real.exp a * Real.exp b :=\n  Real.exp_add\
    \ a b\n\n/-- Exp is monotone: larger exponent → larger weight. -/\ntheorem fep010_exp_mono {a b : ℝ} (h : a ≤ b) : Real.exp\
    \ a ≤ Real.exp b :=\n  Real.exp_le_exp.mpr h\n\n/-- Exp at zero is one (reference state). -/\ntheorem fep010_exp_zero\
    \ : Real.exp 0 = 1 := Real.exp_zero\n\nend FEP010\n"
