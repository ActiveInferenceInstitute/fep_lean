    \end{aligned}'
  - '\begin{aligned}

    &(J_{1} J_{2} F : \mathbb{R}) (hF : 0 \le F) (h : J_{1} \le J_{2}) \\

    &J_{1} * F \le J_{2} * F

    \end{aligned}'
  - '\begin{aligned}

    &(F : \mathbb{R}) \\

