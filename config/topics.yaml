- id: fep-034
  title: Discrete Belief Update (Categorical)
  area: ActiveInference
  mathlib: Algebra.BigOperators.Group.Finset
  mathlib_status: real
  nl: 'Discrete Belief Update (Categorical) (ActiveInference). Catalogue row fep-034; maturity `real` in config/topics.yaml.
    Natural-language anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport Mathlib.Algebra.Order.BigOperators.Group.Finset\n\
    import Mathlib.Data.Real.Basic\n\nnamespace FEP034\n\nopen Finset\n\n-- [proof strategy: mul_nonneg + Finset.sum_nonneg\
    \ for categorical Bayesian filter]\n\nabbrev State := Fin 9\n\n/-- Unnormalized Bayesian belief update at state `s`: multiplies\
    \ the\nlikelihood at `s` by the predicted prior obtained by summing the transition\nkernel against the previous belief\
    \ over `states`. -/\ndef fep034_beliefUpdate (prior : State → ℝ) (trans : State → State → ℝ) (like : State → ℝ)\n    (states\
    \ : Finset State) (s : State) : ℝ :=\n  like s * ∑ s' ∈ states, trans s s' * prior s'\n\n/-- Per-state unnormalized posterior\
    \ is nonneg. -/\ntheorem fep034_update_nonneg (prior : State → ℝ) (trans : State → State → ℝ) (like : State → ℝ)\n   \
    \ (states : Finset State) (s : State) (hp : ∀ x, 0 ≤ prior x) (ht : ∀ x y, 0 ≤ trans x y)\n    (hl : ∀ x, 0 ≤ like x)\
    \ : 0 ≤ fep034_beliefUpdate prior trans like states s :=\n  mul_nonneg (hl s) (Finset.sum_nonneg fun s' _ => mul_nonneg\
    \ (ht s s') (hp s'))\n\n/-- Total unnormalized posterior mass over a finite state finset is nonneg. -/\ntheorem fep034_totalUnnorm_nonneg\
    \ (prior : State → ℝ) (trans : State → State → ℝ) (like : State → ℝ)\n    (states : Finset State) (hp : ∀ x, 0 ≤ prior\
    \ x) (ht : ∀ x y, 0 ≤ trans x y)\n    (hl : ∀ x, 0 ≤ like x) :\n    0 ≤ ∑ s ∈ states, fep034_beliefUpdate prior trans\
    \ like states s :=\n  Finset.sum_nonneg fun s _ =>\n    fep034_update_nonneg prior trans like states s hp ht hl\n\n/--\
    \ Zero likelihood zeros out the posterior at that state. -/\ntheorem fep034_zero_like (prior : State → ℝ) (trans : State\
    \ → State → ℝ)\n    (states : Finset State) (s : State) :\n    fep034_beliefUpdate prior trans (fun _ => 0) states s =\
    \ 0 := by\n  simp [fep034_beliefUpdate, mul_zero]\n\nend FEP034\n"
  latex_equations:
  - "\\begin{aligned}\n&(prior : State \\Rightarrow \\mathbb{R}) (trans : State \\Rightarrow State \\Rightarrow \\mathbb{R})\
    \ (like : State \\Rightarrow \\mathbb{R})\n    (states : \\mathsf{Finset} State) (s : State) (hp : \\forall x, 0 \\le\
    \ prior x) (ht : \\forall x y, 0 \\le trans x y)\n    (hl : \\forall x, 0 \\le like x) \\\\\n&0 \\le fep034_beliefUpdate\
    \ prior trans like states s\n\\end{aligned}"
