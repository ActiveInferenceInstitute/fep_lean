    \ (like : State \\Rightarrow \\mathbb{R})\n    (states : \\mathsf{Finset} State) (hp : \\forall x, 0 \\le prior x) (ht\
    \ : \\forall x y, 0 \\le trans x y)\n    (hl : \\forall x, 0 \\le like x) \\\\\n&0 \\le \\sum s \\in states, fep034_beliefUpdate\
    \ prior trans like states s\n\\end{aligned}"
