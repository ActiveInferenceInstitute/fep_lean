    \    (states : \\mathsf{Finset} State) (s : State) \\\\\n&fep034_beliefUpdate prior trans (\\lambda _ => 0) states s =\
    \ 0\n\\end{aligned}"
- id: fep-035
  title: Jensen's Inequality for Log
  area: FEP
