  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Log.Basic\n\nnamespace FEP011\n\nopen Real\n\n-- [proof strategy:\
    \ Real.log_nonneg / log_nonpos to bound self-information; log_mul for additivity]\n\n/-- Self-information: log is nonnegative\
    \ on ``[1, ∞)``. -/\ntheorem fep011_log_nonneg_on_ge_one {x : ℝ} (hx : 1 ≤ x) : 0 ≤ Real.log x :=\n  Real.log_nonneg hx\n\
    \n/-- Coding cost ``-log u`` is nonnegative for probabilities ``u ∈ (0, 1]``. -/\ntheorem fep011_negLog_nonneg_prob {u\
    \ : ℝ} (hu : 0 < u) (hu1 : u ≤ 1) : 0 ≤ -Real.log u :=\n  neg_nonneg.mpr (Real.log_nonpos (le_of_lt hu) hu1)\n\n/-- Surprise\
    \ is additive for independent observations: -log(ab) = -log a + -log b. -/\ntheorem fep011_surprise_additive {a b : ℝ}\
    \ (ha : 0 < a) (hb : 0 < b) :\n    -Real.log (a * b) = -Real.log a + -Real.log b := by\n  rw [Real.log_mul (ne_of_gt ha)\
    \ (ne_of_gt hb), neg_add]\n\n/-- Surprise of certain event (u = 1) is zero. -/\ntheorem fep011_surprise_cert : -Real.log\
    \ 1 = 0 := by simp\n\n/-- Surprise is monotone decreasing in probability: larger p → lower surprise. -/\ntheorem fep011_surprise_mono\
    \ {p q : ℝ} (hp : 0 < p) (h : p ≤ q) :\n    -Real.log q ≤ -Real.log p :=\n  neg_le_neg (Real.log_le_log hp h)\n\nend FEP011\n"
