    \ for evidence]\n\nabbrev State := Fin 8\n\n/-- Bayesian update: posterior ∝ likelihood × prior (unnormalized). -/\ndef\
    \ fep017_posterior (prior likelihood : State → ℝ) (s : State) : ℝ :=\n  likelihood s * prior s\n\n/-- Posterior is nonnegative\
    \ when prior and likelihood are nonnegative. -/\ntheorem fep017_posterior_nonneg (prior likelihood : State → ℝ)\n    (hp\
    \ : ∀ s, 0 ≤ prior s) (hl : ∀ s, 0 ≤ likelihood s) (s : State) :\n    0 ≤ fep017_posterior prior likelihood s :=\n  mul_nonneg\
    \ (hl s) (hp s)\n\n/-- Total evidence (normalization constant) is nonneg. -/\ntheorem fep017_evidence_nonneg (prior likelihood\
