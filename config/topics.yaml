- id: fep-010
  title: Fluctuation Theorem Sketch
  area: BayesianMechanics
  mathlib: Analysis.SpecialFunctions.Exp
  mathlib_status: real
  nl: 'Fluctuation Theorem Sketch (BayesianMechanics). Catalogue row fep-010; maturity `real` in config/topics.yaml. Natural-language
    anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

