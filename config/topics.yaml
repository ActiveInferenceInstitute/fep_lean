- id: fep-001
  title: Variational Free Energy Bound
  area: FEP
  mathlib: MeasureTheory.Measure.MeasureSpace
  mathlib_status: real
  nl: 'Variational Free Energy Bound (FEP). Catalogue row fep-001; maturity `real` in config/topics.yaml. Natural-language
    anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.MeasureTheory.Measure.MeasureSpace\n\nnamespace FEP001\n\nvariable {α : Type*} [MeasurableSpace\
    \ α]\n\nopen MeasureTheory\n\n/-- Measure subadditivity: μ(A ∪ B) ≤ μ(A) + μ(B), fundamental for variational bounds. -/\n\
    theorem fep001_measure_union_le (μ : Measure α) (s t : Set α) :\n    μ (s ∪ t) ≤ μ s + μ t :=\n  measure_union_le s t\n\
    \n/-- Measure monotonicity: s ⊆ t implies μ(s) ≤ μ(t), used in free energy bounding. -/\ntheorem fep001_measure_mono {μ\
    \ : Measure α} {s t : Set α} (h : s ⊆ t) : μ s ≤ μ t :=\n  measure_mono h\n\n/-- Empty set has measure zero — VFE vanishes\
    \ on the empty event. -/\ntheorem fep001_measure_empty (μ : Measure α) : μ ∅ = 0 :=\n  measure_empty\n\n/-- Measure is\
    \ nonneg on any set (ENNReal baseline for VFE). -/\ntheorem fep001_measure_nonneg_any (μ : Measure α) (s : Set α) : 0\
    \ ≤ μ s :=\n  zero_le _\n\nend FEP001\n"
  latex_equations:
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &(\mu : \mathsf{Measure}~\alpha) (s t : \mathsf{Set}~\alpha) \\

    &\mu (s \cup t) \le \mu s + \mu t

    \end{aligned}'
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &{\mu : \mathsf{Measure}~\alpha} {s t : \mathsf{Set}~\alpha} (h : s \subseteq t) \\

    &\mu s \le \mu t

    \end{aligned}'
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &(\mu : \mathsf{Measure}~\alpha) \\

    &\mu(\varnothing) = 0

    \end{aligned}'
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &(\mu : \mathsf{Measure}~\alpha) (s : \mathsf{Set}~\alpha) \\

    &0 \le \mu s

    \end{aligned}'
- id: fep-002
  title: Gibbs Free Energy as Marginal Likelihood
  area: FEP
  mathlib: MeasureTheory.Measure.MeasureSpace
  mathlib_status: real
  nl: 'Gibbs Free Energy as Marginal Likelihood (FEP). Catalogue row fep-002; maturity `real` in config/topics.yaml. Natural-language
    anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.MeasureTheory.Measure.MeasureSpace\nimport Mathlib.MeasureTheory.Measure.Typeclasses.Probability\n\
    \nnamespace FEP002\n\nvariable {α : Type*} [MeasurableSpace α]\n\nopen MeasureTheory\n\n-- [proof strategy: IsProbabilityMeasure.measure_univ\
    \ + measure_compl for complement; linarith for ELBO]\n/-- A probability measure assigns unit total mass. -/\ntheorem fep002_prob_measure_univ\
    \ (μ : Measure α) [IsProbabilityMeasure μ] :\n    μ Set.univ = 1 :=\n  IsProbabilityMeasure.measure_univ\n\n/-- Complement:\
    \ μ(sᶜ) = 1 - μ(s) for probability measures on measurable sets. -/\ntheorem fep002_prob_compl (μ : Measure α) [IsProbabilityMeasure\
    \ μ] {s : Set α}\n    (hs : MeasurableSet s) (hfin : μ s ≠ ⊤) :\n    μ sᶜ = 1 - μ s := by\n  rw [measure_compl hs hfin,\
    \ IsProbabilityMeasure.measure_univ]\n\n/-- ELBO: free energy ≤ log marginal likelihood (KL ≥ 0). -/\ntheorem fep002_elbo_bound\
    \ (logEvidence freeEnergy klDiv : ℝ)\n    (h_decomp : logEvidence = freeEnergy + klDiv)\n    (h_kl_nonneg : 0 ≤ klDiv)\
    \ :\n    freeEnergy ≤ logEvidence := by linarith\n\nend FEP002\n"
  latex_equations:
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &(\mu : \mathsf{Measure}~\alpha) [\mathsf{IsProbabilityMeasure}~\mu] \\

    &\mu(\Omega) = 1

    \end{aligned}'
  - "\\begin{aligned}\n&{\\alpha : \\mathsf{Type}^\\*} [\\mathsf{MeasurableSpace}~\\alpha] \\\\\n&(\\mu : \\mathsf{Measure}~\\\
    alpha) [\\mathsf{IsProbabilityMeasure}~\\mu] {s : \\mathsf{Set}~\\alpha}\n    (hs : \\mathsf{MeasurableSet} s) (hfin :\
    \ \\mu s \\ne \\top) \\\\\n&\\mu s^{\\mathrm{c}} = 1 - \\mu s\n\\end{aligned}"
  - "\\begin{aligned}\n&{\\alpha : \\mathsf{Type}^\\*} [\\mathsf{MeasurableSpace}~\\alpha] \\\\\n&(logEvidence freeEnergy\
    \ klDiv : \\mathbb{R})\n    (h_decomp : logEvidence = freeEnergy + klDiv)\n    (h_kl_nonneg : 0 \\le klDiv) \\\\\n&freeEnergy\
    \ \\le logEvidence\n\\end{aligned}"
- id: fep-003
  title: Expected Free Energy Decomposition
  area: ActiveInference
  mathlib: Algebra.BigOperators.Group.Finset
  mathlib_status: real
  nl: 'Expected Free Energy Decomposition (ActiveInference). Catalogue row fep-003; maturity `real` in config/topics.yaml.
    Natural-language anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport Mathlib.Algebra.Order.BigOperators.Group.Finset\n\
    import Mathlib.Data.Real.Basic\n\nnamespace FEP003\n\nabbrev Obs := Fin 6\nabbrev State := Fin 6\n\n/-- Expected free\
    \ energy aggregates nonnegative stage costs over discrete states. -/\ntheorem fep003_stageSum_nonneg (c : Obs → State\
    \ → ℝ) (o : Obs) (s : Finset State)\n    (hc : ∀ x ∈ s, 0 ≤ c o x) : 0 ≤ ∑ x ∈ s, c o x :=\n  Finset.sum_nonneg hc\n\n\
    /-- EFE respects cost dominance: if cₐ ≤ c_b pointwise, total EFE(a) ≤ EFE(b). -/\ntheorem fep003_efe_monotone (ca cb\
    \ : State → ℝ) (S : Finset State)\n    (h : ∀ x ∈ S, ca x ≤ cb x) : ∑ x ∈ S, ca x ≤ ∑ x ∈ S, cb x :=\n  Finset.sum_le_sum\
    \ h\n\n/-- EFE over disjoint state sets is the sum of per-set EFEs. -/\ntheorem fep003_efe_union_disjoint (c : State →\
    \ ℝ) (s t : Finset State)\n    (hd : Disjoint s t) : ∑ x ∈ s ∪ t, c x = (∑ x ∈ s, c x) + ∑ x ∈ t, c x :=\n  Finset.sum_union\
    \ hd\n\n/-- EFE zero when every state contributes zero cost. -/\ntheorem fep003_efe_zero_of_zero (c : State → ℝ) (S :\
    \ Finset State)\n    (h : ∀ x ∈ S, c x = 0) : ∑ x ∈ S, c x = 0 :=\n  Finset.sum_eq_zero h\n\nend FEP003\n"
  latex_equations:
  - "\\begin{aligned}\n&(c : Obs \\Rightarrow State \\Rightarrow \\mathbb{R}) (o : Obs) (s : \\mathsf{Finset} State)\n   \
    \ (hc : \\forall x \\in s, 0 \\le c o x) \\\\\n&0 \\le \\sum x \\in s, c o x\n\\end{aligned}"
  - "\\begin{aligned}\n&(ca cb : State \\Rightarrow \\mathbb{R}) (S : \\mathsf{Finset} State)\n    (h : \\forall x \\in S,\
    \ ca x \\le cb x) \\\\\n&\\sum x \\in S, ca x \\le \\sum x \\in S, cb x\n\\end{aligned}"
  - "\\begin{aligned}\n&(c : State \\Rightarrow \\mathbb{R}) (s t : \\mathsf{Finset} State)\n    (hd : \\mathsf{Disjoint}\
    \ s t) \\\\\n&\\sum x \\in s \\cup t, c x = (\\sum x \\in s, c x) + \\sum x \\in t, c x\n\\end{aligned}"
  - "\\begin{aligned}\n&(c : State \\Rightarrow \\mathbb{R}) (S : \\mathsf{Finset} State)\n    (h : \\forall x \\in S, c x\
    \ = 0) \\\\\n&\\sum x \\in S, c x = 0\n\\end{aligned}"
- id: fep-004
  title: Fisher Information Metric
  area: InfoGeometry
  mathlib: Analysis.InnerProductSpace.Basic
  mathlib_status: real
  nl: 'Fisher Information Metric (InfoGeometry). Catalogue row fep-004; maturity `real` in config/topics.yaml. Natural-language
    anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Analysis.InnerProductSpace.Basic\nimport Mathlib.Algebra.BigOperators.Group.Finset.Basic\n\
    import Mathlib.Algebra.Order.BigOperators.Group.Finset\nimport Mathlib.Data.Real.Basic\n\nnamespace FEP004\n\nopen Finset\n\
    \n-- [proof strategy: sq_nonneg for score² ≥ 0; Finset.sum_nonneg for Fisher PSD]\n\n/-- Fisher metric context: the squared\
    \ score is nonnegative (building block for Fisher info). -/\ntheorem fep004_score_sq_nonneg (s : ℝ) : 0 ≤ s ^ 2 :=\n \
    \ sq_nonneg s\n\n/-- Fisher information: parameter difference squared is nonneg. -/\ntheorem fep004_residual_sq_nonneg\
    \ (θ₁ θ₂ : ℝ) : 0 ≤ (θ₁ - θ₂) ^ 2 :=\n  sq_nonneg _\n\n/-- Fisher metric positive-semidefiniteness anchor: inner product\
    \ with self is nonneg. -/\ntheorem fep004_inner_self_nonneg (v : Fin 2 → ℝ) :\n    0 ≤ ∑ i : Fin 2, v i * v i :=\n  Finset.sum_nonneg\
    \ fun i _ => mul_self_nonneg (v i)\n\n/-- Fisher metric is symmetric: ⟨u, v⟩ = ⟨v, u⟩ on coordinate vectors. -/\ntheorem\
    \ fep004_inner_sym (u v : Fin 2 → ℝ) :\n    ∑ i : Fin 2, u i * v i = ∑ i : Fin 2, v i * u i := by\n  refine Finset.sum_congr\
    \ rfl ?_\n  intro i _; ring\n\n/-- Zero vector has zero Fisher norm. -/\ntheorem fep004_inner_zero :\n    (∑ i : Fin 2,\
    \ (0 : ℝ) * (0 : ℝ)) = 0 := by simp\n\nend FEP004\n"
  latex_equations:
  - '\begin{aligned}

    &(s : \mathbb{R}) \\

    &0 \le s ^ 2

    \end{aligned}'
  - '\begin{aligned}

    &(\theta_{1} \theta_{2} : \mathbb{R}) \\

    &0 \le (\theta_{1} - \theta_{2}) ^ 2

    \end{aligned}'
  - '\begin{aligned}

    &(v : Fin 2 \Rightarrow \mathbb{R}) \\

    &0 \le \sum i : Fin 2, v i * v i

    \end{aligned}'
  - '\begin{aligned}

    &(u v : Fin 2 \Rightarrow \mathbb{R}) \\

    &\sum i : Fin 2, u i * v i = \sum i : Fin 2, v i * u i

    \end{aligned}'
  - '(\sum i : Fin 2, (0 : \mathbb{R}) * (0 : \mathbb{R})) = 0'
- id: fep-005
  title: Markov Blanket Partition
  area: BayesianMechanics
  mathlib: Data.Finset.Basic
  mathlib_status: real
  nl: 'Markov Blanket Partition (BayesianMechanics). Catalogue row fep-005; maturity `real` in config/topics.yaml. Natural-language
    anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Data.Finset.Basic\nimport Mathlib.Data.Finset.Filter\nimport Mathlib.Data.Fintype.Basic\n\n\
    namespace FEP005\n\nopen Finset\n\nabbrev BlkPart := Fin 4  -- internal(0), sensory(1), active(2), active/external(3)\n\
    \n/-- Markov blanket partition: four components cover the full state space exactly. -/\ndef fep005_partitionCover (assign\
    \ : Fin 20 → BlkPart) (k : BlkPart) : Finset (Fin 20) :=\n  Finset.univ.filter (fun s => assign s = k)\n\n/-- The four\
    \ partition blocks are pairwise disjoint (functional determinism). -/\ntheorem fep005_disjoint (assign : Fin 20 → BlkPart)\
    \ (i j : BlkPart) (hij : i ≠ j) :\n    Disjoint (fep005_partitionCover assign i) (fep005_partitionCover assign j) := by\n\
    \  refine Finset.disjoint_left.mpr ?_\n  intro x hx hy\n  simp only [fep005_partitionCover, Finset.mem_filter, Finset.mem_univ,\
    \ true_and] at hx hy\n  exact hij ((Eq.symm hx).trans hy)\n\n/-- Every state belongs to exactly one partition block (totality\
    \ of assignment). -/\ntheorem fep005_total_cover (assign : Fin 20 → BlkPart) :\n    ∀ s : Fin 20, ∃ k : BlkPart, s ∈ fep005_partitionCover\
    \ assign k := by\n  intro s\n  refine ⟨assign s, Finset.mem_filter.mpr ⟨Finset.mem_univ s, rfl⟩⟩\n\n/-- Membership is\
    \ decidable: a state is in block k iff its assignment equals k. -/\ntheorem fep005_mem_iff (assign : Fin 20 → BlkPart)\
    \ (s : Fin 20) (k : BlkPart) :\n    s ∈ fep005_partitionCover assign k ↔ assign s = k := by\n  dsimp [fep005_partitionCover]\n\
    \  exact Iff.intro (fun h => (Finset.mem_filter.mp h).2)\n    fun hk => Finset.mem_filter.mpr ⟨Finset.mem_univ s, hk⟩\n\
    \nend FEP005\n"
  latex_equations:
  - '\begin{aligned}

    &(\mathsf{assign} : Fin 20 \Rightarrow BlkPart) (i j : BlkPart) (hij : i \ne j) \\

    &\mathsf{Disjoint} (fep005_partitionCover \mathsf{assign} i) (fep005_partitionCover \mathsf{assign} j)

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{assign} : Fin 20 \Rightarrow BlkPart) \\

    &\forall s : Fin 20, \exists k : BlkPart, s \in fep005_partitionCover \mathsf{assign} k

    \end{aligned}'
  - '\begin{aligned}

    &(\mathsf{assign} : Fin 20 \Rightarrow BlkPart) (s : Fin 20) (k : BlkPart) \\

    &s \in fep005_partitionCover \mathsf{assign} k \leftrightarrow \mathsf{assign} s = k

    \end{aligned}'
- id: fep-006
  title: Generalized State and Flow
  area: FEP
  mathlib: MeasureTheory.Measure.MeasureSpace
  mathlib_status: real
  nl: 'Generalized State and Flow (FEP). Catalogue row fep-006; maturity `real` in config/topics.yaml. Natural-language anchor
    for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.MeasureTheory.Measure.MeasureSpace\n\nnamespace FEP006\n\nvariable {α : Type*} [MeasurableSpace\
    \ α]\n\nopen MeasureTheory\n\n-- [proof strategy: zero_le for ENNReal + measure_empty + Measurable.comp for flow composition]\n\
    \n/-- Generalized states: measure mass on the whole space is nonnegative. -/\ntheorem fep006_univ_nonneg (μ : Measure\
    \ α) : 0 ≤ μ Set.univ :=\n  zero_le _\n\n/-- Empty set has zero measure (initialisation of flow integration). -/\ntheorem\
    \ fep006_empty_zero (μ : Measure α) : μ ∅ = 0 :=\n  measure_empty\n\n/-- Flow trajectories: composition of measurable\
    \ maps is measurable. -/\ntheorem fep006_comp_measurable {β γ : Type*} [MeasurableSpace β] [MeasurableSpace γ]\n    {f\
    \ : α → β} {g : β → γ} (hf : Measurable f) (hg : Measurable g) :\n    Measurable (g ∘ f) :=\n  hg.comp hf\n\n/-- Identity\
    \ flow is measurable (trivial flow). -/\ntheorem fep006_id_measurable : Measurable (id : α → α) :=\n  measurable_id\n\n\
    /-- Constant flows (absorbing states) are measurable. -/\ntheorem fep006_const_measurable {β : Type*} [MeasurableSpace\
    \ β] (c : β) :\n    Measurable (fun _ : α => c) :=\n  measurable_const\n\nend FEP006\n"
  latex_equations:
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &(\mu : \mathsf{Measure}~\alpha) \\

    &0 \le \mu(\Omega)

    \end{aligned}'
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &(\mu : \mathsf{Measure}~\alpha) \\

    &\mu(\varnothing) = 0

    \end{aligned}'
  - "\\begin{aligned}\n&{\\alpha : \\mathsf{Type}^\\*} [\\mathsf{MeasurableSpace}~\\alpha] \\\\\n&{\\beta \\gamma : \\mathsf{Type}^\\\
    *} [\\mathsf{MeasurableSpace} \\beta] [\\mathsf{MeasurableSpace} \\gamma]\n    {f : \\alpha \\Rightarrow \\beta} {g :\
    \ \\beta \\Rightarrow \\gamma} (hf : \\mathsf{Measurable} f) (hg : \\mathsf{Measurable} g) \\\\\n&\\mathsf{Measurable}\
    \ (g \\circ f)\n\\end{aligned}"
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &\mathsf{Measurable} (\mathsf{id} : \alpha \Rightarrow \alpha)

    \end{aligned}'
  - '\begin{aligned}

    &{\alpha : \mathsf{Type}^\*} [\mathsf{MeasurableSpace}~\alpha] \\

    &{\beta : \mathsf{Type}^\*} [\mathsf{MeasurableSpace} \beta] (c : \beta) \\

    &\mathsf{Measurable} (\lambda _ : \alpha => c)

    \end{aligned}'
- id: fep-007
  title: Belief Propagation on Factor Graphs
  area: ActiveInference
  mathlib: Algebra.BigOperators.Group.Finset
  mathlib_status: real
  nl: 'Belief Propagation on Factor Graphs (ActiveInference). Catalogue row fep-007; maturity `real` in config/topics.yaml.
    Natural-language anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport Mathlib.Algebra.Order.BigOperators.Group.Finset\n\
    import Mathlib.Data.Real.Basic\n\nnamespace FEP007\n\nopen Finset\n\n-- [proof strategy: mul_nonneg / Finset.sum_nonneg\
    \ for positivity; Finset.sum_le_sum for monotone updates]\n\nabbrev Node := Fin 8\n\n/-- Belief propagation: local potential\
    \ products stay nonnegative when factors are. -/\ntheorem fep007_factorProduct_nonneg (ψ : Node → Node → ℝ) (i j : Node)\n\
    \    (hψ : 0 ≤ ψ i j) (hj : 0 ≤ ψ j i) : 0 ≤ ψ i j * ψ j i := by\n  exact mul_nonneg hψ hj\n\n/-- Message aggregation:\
    \ sum of factor-weighted messages stays nonneg. -/\ntheorem fep007_message_agg_nonneg (ψ : Node → Node → ℝ) (msg : Node\
    \ → ℝ)\n    (N : Finset Node) (i : Node)\n    (hψ : ∀ j, 0 ≤ ψ i j) (hm : ∀ j, 0 ≤ msg j) :\n    0 ≤ ∑ j ∈ N, ψ i j *\
    \ msg j :=\n  Finset.sum_nonneg fun j _ => mul_nonneg (hψ j) (hm j)\n\n/-- Monotonicity: stronger messages → stronger\
    \ aggregate. -/\ntheorem fep007_message_agg_mono (ψ : Node → Node → ℝ) (m₁ m₂ : Node → ℝ)\n    (N : Finset Node) (i :\
    \ Node)\n    (hψ : ∀ j, 0 ≤ ψ i j) (h : ∀ j ∈ N, m₁ j ≤ m₂ j) :\n    ∑ j ∈ N, ψ i j * m₁ j ≤ ∑ j ∈ N, ψ i j * m₂ j :=\n\
    \  Finset.sum_le_sum fun j hj => mul_le_mul_of_nonneg_left (h j hj) (hψ j)\n\n/-- Zero messages yield zero aggregate (absorbing\
    \ behaviour). -/\ntheorem fep007_zero_msg (ψ : Node → Node → ℝ) (N : Finset Node) (i : Node) :\n    ∑ j ∈ N, ψ i j * (0\
    \ : ℝ) = 0 := by simp\n\nend FEP007\n"
  latex_equations:
  - "\\begin{aligned}\n&(ψ : Node \\Rightarrow Node \\Rightarrow \\mathbb{R}) (i j : Node)\n    (hψ : 0 \\le ψ i j) (hj :\
    \ 0 \\le ψ j i) \\\\\n&0 \\le ψ i j * ψ j i\n\\end{aligned}"
  - "\\begin{aligned}\n&(ψ : Node \\Rightarrow Node \\Rightarrow \\mathbb{R}) (msg : Node \\Rightarrow \\mathbb{R})\n    (N\
    \ : \\mathsf{Finset} Node) (i : Node)\n    (hψ : \\forall j, 0 \\le ψ i j) (hm : \\forall j, 0 \\le msg j) \\\\\n&0 \\\
    le \\sum j \\in N, ψ i j * msg j\n\\end{aligned}"
  - "\\begin{aligned}\n&(ψ : Node \\Rightarrow Node \\Rightarrow \\mathbb{R}) (m_{1} m_{2} : Node \\Rightarrow \\mathbb{R})\n\
    \    (N : \\mathsf{Finset} Node) (i : Node)\n    (hψ : \\forall j, 0 \\le ψ i j) (h : \\forall j \\in N, m_{1} j \\le\
    \ m_{2} j) \\\\\n&\\sum j \\in N, ψ i j * m_{1} j \\le \\sum j \\in N, ψ i j * m_{2} j\n\\end{aligned}"
  - '\begin{aligned}

    &(ψ : Node \Rightarrow Node \Rightarrow \mathbb{R}) (N : \mathsf{Finset} Node) (i : Node) \\

    &\sum j \in N, ψ i j * (0 : \mathbb{R}) = 0

    \end{aligned}'
- id: fep-008
  title: Active Inference Optimal Policy
  area: ActiveInference
  mathlib: Data.Finset.Basic, Order.Bounds.Basic
  mathlib_status: real
  nl: 'Active Inference Optimal Policy (ActiveInference). Catalogue row fep-008; maturity `real` in config/topics.yaml. Natural-language
    anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Data.Finset.Basic\nimport Mathlib.Data.Finset.Max\nimport Mathlib.Data.Real.Basic\nimport Mathlib.Order.Bounds.Basic\n\
    \nnamespace FEP008\n\nabbrev Policy := Fin 14\n\n/-- Discrete active inference: some policy minimizes expected free energy\
    \ on a finite set. -/\ntheorem fep008_exists_minG (policies : Finset Policy) (hne : policies.Nonempty) (G : Policy → ℝ)\
    \ :\n    ∃ p ∈ policies, ∀ p' ∈ policies, G p ≤ G p' :=\n  Finset.exists_min_image policies G hne\n\n/-- Any two policy\
    \ minimizers attain the same value (uniqueness of the minimum). -/\ntheorem fep008_min_agrees_on_value (policies : Finset\
    \ Policy) (hne : policies.Nonempty) (G : Policy → ℝ)\n    (p p' : Policy) (hp : p ∈ policies) (hp' : p' ∈ policies)\n\
    \    (hmin : ∀ p'' ∈ policies, G p ≤ G p'') (hmin' : ∀ p'' ∈ policies, G p' ≤ G p'') :\n    G p = G p' :=\n  le_antisymm\
    \ (hmin p' hp') (hmin' p hp)\n\n/-- Dual: some policy maximizes expected value on a finite nonempty set. -/\ntheorem fep008_exists_maxG\
    \ (policies : Finset Policy) (hne : policies.Nonempty) (G : Policy → ℝ) :\n    ∃ p ∈ policies, ∀ p' ∈ policies, G p' ≤\
    \ G p :=\n  Finset.exists_max_image policies G hne\n\n/-- Minimum is ≤ any evaluation in the policy set. -/\ntheorem fep008_min_is_lb\
    \ (policies : Finset Policy) (G : Policy → ℝ)\n    (p : Policy) (_hp : p ∈ policies)\n    (hmin : ∀ p' ∈ policies, G p\
    \ ≤ G p') :\n    ∀ p' ∈ policies, G p ≤ G p' := hmin\n\nend FEP008\n"
  latex_equations:
  - '\begin{aligned}

    &(policies : \mathsf{Finset} Policy) (hne : policies.Nonempty) (G : Policy \Rightarrow \mathbb{R}) \\

    &\exists p \in policies, \forall p'' \in policies, G p \le G p''

    \end{aligned}'
  - "\\begin{aligned}\n&(policies : \\mathsf{Finset} Policy) (hne : policies.Nonempty) (G : Policy \\Rightarrow \\mathbb{R})\n\
    \    (p p' : Policy) (hp : p \\in policies) (hp' : p' \\in policies)\n    (hmin : \\forall p'' \\in policies, G p \\le\
    \ G p'') (hmin' : \\forall p'' \\in policies, G p' \\le G p'') \\\\\n&G p = G p'\n\\end{aligned}"
  - '\begin{aligned}

    &(policies : \mathsf{Finset} Policy) (hne : policies.Nonempty) (G : Policy \Rightarrow \mathbb{R}) \\

