  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Log.Basic\n\nnamespace FEP035\n\nopen Real\n\n-- [proof strategy:\
    \ Real.log_mul / log_pow / log_exp give Jensen-for-log identities]\n\n/-- Logarithm turns products into sums (``log(ab)=log\
    \ a+log b``). -/\ntheorem fep035_log_mul {a b : ℝ} (ha : 0 < a) (hb : 0 < b) :\n    Real.log (a * b) = Real.log a + Real.log\
    \ b :=\n  Real.log_mul (ne_of_gt ha) (ne_of_gt hb)\n\n/-- Power rule for logarithms on ``(0,∞)``. -/\ntheorem fep035_log_pow\
    \ {a : ℝ} (_ha : 0 < a) (n : ℕ) : Real.log (a ^ n) = n * Real.log a :=\n  Real.log_pow a n\n\n/-- Jensen anchor: log(exp\
    \ x) = x (log-exp inverse). -/\ntheorem fep035_log_exp (x : ℝ) : Real.log (Real.exp x) = x :=\n  Real.log_exp x\n\n/--\
    \ Concavity anchor: log on (0,∞) is monotone. -/\ntheorem fep035_log_mono {a b : ℝ} (ha : 0 < a) (h : a ≤ b) :\n    Real.log\
    \ a ≤ Real.log b :=\n  Real.log_le_log ha h\n\n/-- log 1 = 0. -/\ntheorem fep035_log_one : Real.log (1 : ℝ) = 0 := Real.log_one\n\
    \nend FEP035\n"
  latex_equations:
  - '\begin{aligned}

    &{a b : \mathbb{R}} (ha : 0 < a) (hb : 0 < b) \\

    &\mathbb{R}.\log (a * b) = \mathbb{R}.\log a + \mathbb{R}.\log b

    \end{aligned}'
  - '\begin{aligned}

    &{a : \mathbb{R}} (_ha : 0 < a) (n : \mathbb{N}) \\

