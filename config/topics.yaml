- id: fep-047
  title: Active Inference Message Passing
  area: ActiveInference
  mathlib: Algebra.BigOperators.Group.Finset
  mathlib_status: real
  nl: 'Active Inference Message Passing (ActiveInference). Catalogue row fep-047; maturity `real` in config/topics.yaml. Natural-language
    anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Algebra.BigOperators.Group.Finset.Basic\nimport Mathlib.Algebra.Order.BigOperators.Group.Finset\n\
    import Mathlib.Data.Real.Basic\n\nnamespace FEP047\n\nopen Finset\n\n-- [proof strategy: Finset.sum_nonneg + mul_nonneg\
    \ + sum_le_sum with left-multiplication]\n\nabbrev State := Fin 7\n\n/-- Forward message in a sum-product factor graph:\
    \ aggregates the product of\nthe local factor `ψ x y` with the incoming message `inc y` over the neighbour\nset `S`. -/\n\
    def fep047_forward (ψ : State → State → ℝ) (inc : State → ℝ) (S : Finset State) (x : State) : ℝ :=\n  ∑ y ∈ S, ψ x y *\
    \ inc y\n\n/-- Forward message is nonneg when factors and incoming messages are nonneg. -/\ntheorem fep047_forward_nonneg\
    \ (ψ : State → State → ℝ) (inc : State → ℝ) (S : Finset State)\n    (x : State) (hψ : ∀ a b, 0 ≤ ψ a b) (hi : ∀ y, 0 ≤\
    \ inc y) : 0 ≤ fep047_forward ψ inc S x :=\n  Finset.sum_nonneg fun y _ => mul_nonneg (hψ x y) (hi y)\n\n/-- Message-passing\
    \ monotonicity: larger incoming messages → larger output. -/\ntheorem fep047_forward_mono (ψ : State → State → ℝ) (inc₁\
    \ inc₂ : State → ℝ) (S : Finset State)\n    (x : State) (hψ : ∀ a b, 0 ≤ ψ a b) (h : ∀ y ∈ S, inc₁ y ≤ inc₂ y) :\n   \
    \ fep047_forward ψ inc₁ S x ≤ fep047_forward ψ inc₂ S x :=\n  Finset.sum_le_sum fun y hy => mul_le_mul_of_nonneg_left\
    \ (h y hy) (hψ x y)\n\n/-- Zero incoming messages → zero forward output. -/\ntheorem fep047_zero_in (ψ : State → State\
    \ → ℝ) (S : Finset State) (x : State) :\n    fep047_forward ψ (fun _ => 0) S x = 0 := by\n  simp [fep047_forward, mul_zero]\n\
    \n/-- Empty neighbour set → zero forward output. -/\ntheorem fep047_empty_S (ψ : State → State → ℝ) (inc : State → ℝ)\
    \ (x : State) :\n    fep047_forward ψ inc (∅ : Finset State) x = 0 := by\n  simp [fep047_forward, Finset.sum_empty]\n\n\
    end FEP047\n"
  latex_equations:
  - "\\begin{aligned}\n&(ψ : State \\Rightarrow State \\Rightarrow \\mathbb{R}) (inc : State \\Rightarrow \\mathbb{R}) (S\
    \ : \\mathsf{Finset} State)\n    (x : State) (hψ : \\forall a b, 0 \\le ψ a b) (hi : \\forall y, 0 \\le inc y) \\\\\n\
    &0 \\le fep047_forward ψ inc S x\n\\end{aligned}"
  - "\\begin{aligned}\n&(ψ : State \\Rightarrow State \\Rightarrow \\mathbb{R}) (inc_{1} inc_{2} : State \\Rightarrow \\mathbb{R})\
    \ (S : \\mathsf{Finset} State)\n    (x : State) (hψ : \\forall a b, 0 \\le ψ a b) (h : \\forall y \\in S, inc_{1} y \\\
    le inc_{2} y) \\\\\n&fep047_forward ψ inc_{1} S x \\le fep047_forward ψ inc_{2} S x\n\\end{aligned}"
  - '\begin{aligned}

    &(ψ : State \Rightarrow State \Rightarrow \mathbb{R}) (S : \mathsf{Finset} State) (x : State) \\

