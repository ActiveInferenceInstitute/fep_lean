    \ (c : ℕ → ℝ) (T : Finset ℕ) (hc : ∀ t ∈ T, 0 ≤ c t) :\n    0 ≤ ∑ t ∈ T, c t :=\n  Finset.sum_nonneg hc\n\n/-- Longer\
