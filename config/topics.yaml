  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Log.Basic\nimport Mathlib.Algebra.BigOperators.Ring.Finset\nimport\
    \ Mathlib.Data.Real.Basic\nimport Mathlib.Tactic\n\nnamespace FEP030\n\nopen Real Finset\n\n-- [proof strategy: uniform\
    \ weights 1/n are nonneg; sum via sum_div + card_range; log n ≥ 0 via log_nonneg]\n\n/-- Maximum entropy: uniform weight\
    \ 1/n is nonneg for positive n. -/\ntheorem fep030_uniform_nonneg (n : ℕ) (_hn : 0 < n) : 0 ≤ (1 : ℝ) / n :=\n  div_nonneg\
    \ zero_le_one (Nat.cast_nonneg' (n := n))\n\n/-- Uniform weights sum to one (normalization of max-entropy distribution).\
    \ -/\ntheorem fep030_uniform_sum_one (n : ℕ) (hn : 0 < n) :\n    ∑ _ ∈ Finset.range n, (1 : ℝ) / n = 1 := by\n  rw [Finset.sum_const,\
    \ Finset.card_range, nsmul_eq_mul]\n  have hn0 : (n : ℝ) ≠ 0 := Nat.cast_ne_zero.mpr (Nat.ne_of_gt hn)\n  field_simp [hn0]\n\
    \n/-- Log of cardinality is nonneg when n ≥ 1 (entropy upper bound). -/\ntheorem fep030_log_card_nonneg (n : ℕ) (hn :\
    \ 1 ≤ n) : 0 ≤ Real.log n := by\n  apply Real.log_nonneg\n  exact_mod_cast hn\n\n/-- Maximum entropy is achieved by uniform\
    \ distribution (qualitative: H(uniform) = log n). -/\ntheorem fep030_entropy_eq_log (n : ℕ) (hn : 0 < n) :\n    -∑ _ ∈\
    \ Finset.range n, (1 : ℝ) / n * Real.log ((1 : ℝ) / n)\n    = Real.log n := by\n  have hnR : (n : ℝ) ≠ 0 := Nat.cast_ne_zero.mpr\
    \ (Nat.ne_of_gt hn)\n  have hlog : Real.log ((1 : ℝ) / n) = - Real.log n := by\n    rw [Real.log_div (one_ne_zero' ℝ)\
    \ hnR, Real.log_one, zero_sub]\n  have hsum : ∑ _ ∈ Finset.range n, (1 : ℝ) / n * Real.log ((1 : ℝ) / n) = - Real.log\
    \ n := by\n    calc\n      ∑ _ ∈ Finset.range n, (1 : ℝ) / n * Real.log ((1 : ℝ) / n)\n          = ∑ _ ∈ Finset.range\
    \ n, (1 : ℝ) / n * (- Real.log n) :=\n            Finset.sum_congr rfl fun _ _ => by rw [hlog]\n      _ = (∑ _ ∈ Finset.range\
    \ n, (1 : ℝ) / n) * (- Real.log n) := by rw [← Finset.sum_mul]\n      _ = 1 * (- Real.log n) := by rw [fep030_uniform_sum_one\
    \ n hn]\n      _ = - Real.log n := by ring\n  rw [hsum, neg_neg]\n\nend FEP030\n"
