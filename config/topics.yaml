  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Pow.Real\n\nnamespace FEP044\n\n-- [proof strategy: add_nonneg +\
    \ mul_nonneg; endpoint identities by ring]\n\n/-- α-divergence: convex combination for α ∈ [0,1] is between endpoints.\
    \ -/\ntheorem fep044_convex_combo_nonneg (α a b : ℝ) (hα0 : 0 ≤ α) (hα1 : α ≤ 1)\n    (ha : 0 ≤ a) (hb : 0 ≤ b) :\n  \
    \  0 ≤ α * a + (1 - α) * b :=\n  add_nonneg (mul_nonneg hα0 ha) (mul_nonneg (sub_nonneg.mpr hα1) hb)\n\n/-- α-divergence\
    \ at α = 1 recovers KL-like term (degenerate case). -/\ntheorem fep044_alpha_one (a b : ℝ) : (1 : ℝ) * a + (1 - 1) * b\
    \ = a := by ring\n\n/-- α-divergence at α = 0 recovers reverse KL-like term. -/\ntheorem fep044_alpha_zero (a b : ℝ) :\
    \ (0 : ℝ) * a + (1 - 0) * b = b := by ring\n\n/-- α-divergence is monotone in the first argument at fixed α, b. -/\ntheorem\
    \ fep044_mono_a (α a₁ a₂ b : ℝ) (hα0 : 0 ≤ α) (h : a₁ ≤ a₂) :\n    α * a₁ + (1 - α) * b ≤ α * a₂ + (1 - α) * b := by\n\
    \  have : α * a₁ ≤ α * a₂ := mul_le_mul_of_nonneg_left h hα0\n  linarith\n\n/-- α-divergence symmetry anchor (α ↔ 1-α\
    \ swap). -/\ntheorem fep044_swap (α a b : ℝ) :\n    α * a + (1 - α) * b = (1 - (1 - α)) * a + (1 - α) * b := by ring\n\
    \nend FEP044\n"
