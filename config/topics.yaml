    '
  lean_sketch: "import Mathlib.Analysis.Calculus.Deriv.Basic\n\nnamespace FEP043\n\n-- [proof strategy: sub_nonneg + sq_nonneg\
    \ + minimum-characterisation algebra]\n\n/-- Critical points: at a minimum, the function value is a lower bound. -/\n\
    theorem fep043_min_is_lower_bound (f : ℝ → ℝ) (x₀ : ℝ) (hmin : ∀ x, f x₀ ≤ f x) (y : ℝ) :\n    f x₀ ≤ f y :=\n  hmin y\n\
    \n/-- At a critical point, f(x₀ + h) - f(x₀) ≥ 0 for all perturbations. -/\ntheorem fep043_perturbation_nonneg (f : ℝ\
    \ → ℝ) (x₀ : ℝ) (hmin : ∀ x, f x₀ ≤ f x) (h : ℝ) :\n    0 ≤ f (x₀ + h) - f x₀ :=\n  sub_nonneg.mpr (hmin _)\n\n/-- Second-order\
    \ condition: Hessian positivity at critical point (quadratic-form PSD). -/\ntheorem fep043_hessian_nonneg_at_min (h :\
    \ ℝ) : 0 ≤ h ^ 2 :=\n  sq_nonneg h\n\n/-- At the critical point itself, f x₀ = f x₀ (reflexivity bound). -/\ntheorem fep043_at_min_self\
    \ (f : ℝ → ℝ) (x₀ : ℝ) : f x₀ ≤ f x₀ := le_refl _\n\n/-- Any two global minima of f agree in value. -/\ntheorem fep043_min_unique_value\
    \ (f : ℝ → ℝ) (x₀ y₀ : ℝ)\n    (hx : ∀ x, f x₀ ≤ f x) (hy : ∀ x, f y₀ ≤ f x) :\n    f x₀ = f y₀ :=\n  le_antisymm (hx\
    \ y₀) (hy x₀)\n\nend FEP043\n"
