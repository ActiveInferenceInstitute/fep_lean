    '
  lean_sketch: "import Mathlib.Data.List.Basic\n\nnamespace FEP045\n\n/-- A conjugate family: prior parameters and a Bayesian\
    \ update rule. -/\nstructure ConjugateFamily where\n  priorParams : ℝ × ℝ\n  update : ℝ × ℝ → ℝ → ℝ × ℝ\n\n/-- Sequential\
    \ Bayesian update via left fold over observations. -/\ndef fep045_conjugateUpdate (F : ConjugateFamily) (data : List ℝ)\
    \ : ℝ × ℝ :=\n  List.foldl F.update F.priorParams data\n\n/-- Posterior always exists constructively. -/\ntheorem fep045_fold_exists\
    \ (F : ConjugateFamily) (data : List ℝ) :\n    ∃ p, fep045_conjugateUpdate F data = p :=\n  ⟨_, rfl⟩\n\n/-- Empty data\
    \ returns the prior unchanged. -/\ntheorem fep045_empty_is_prior (F : ConjugateFamily) :\n    fep045_conjugateUpdate F\
    \ ([] : List ℝ) = F.priorParams :=\n  rfl\n\n/-- Single observation yields one update step. -/\ntheorem fep045_single_update\
    \ (F : ConjugateFamily) (x : ℝ) :\n    fep045_conjugateUpdate F [x] = F.update F.priorParams x :=\n  rfl\n\n/-- Inductive\
    \ step: cons extends the fold. -/\ntheorem fep045_cons_update (F : ConjugateFamily) (x : ℝ) (xs : List ℝ) :\n    fep045_conjugateUpdate\
    \ F (x :: xs) =\n      xs.foldl F.update (F.update F.priorParams x) :=\n  rfl\n\nend FEP045\n"
  latex_equations:
  - '\begin{aligned}

