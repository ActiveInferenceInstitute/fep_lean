    \ outcome. -/\ntheorem fep023_reachable (pol_set : Finset Policy) (q : Policy → Sensory) (p : Policy)\n    (hp : p ∈ pol_set)\
    \ :\n    q p ∈ fep023_affordanceSet pol_set q :=\n  ⟨p, hp, rfl⟩\n\n/-- Expanding the policy set can only grow the affordance\
