    \ ℕ)\n    (hST : S ⊆ T) (hc : ∀ t ∈ T, 0 ≤ c t) :\n    ∑ t ∈ S, c t ≤ ∑ t ∈ T, c t :=\n  Finset.sum_le_sum_of_subset_of_nonneg\
    \ hST (fun t ht _ => hc t ht)\n\n/-- Discounting: scaled costs stay nonneg. -/\ntheorem fep033_discounted_nonneg (c :\
    \ ℕ → ℝ) (γ : ℝ) (T : Finset ℕ)\n    (hc : ∀ t ∈ T, 0 ≤ c t) (hγ : 0 ≤ γ) :\n    0 ≤ ∑ t ∈ T, γ * c t :=\n  Finset.sum_nonneg\
