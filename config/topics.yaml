- id: fep-050
  title: Landauer Bound and Information Thermodynamics
  area: Thermodynamics
  mathlib: Analysis.SpecialFunctions.Log.Basic
  mathlib_status: real
  nl: 'Landauer Bound and Information Thermodynamics (Thermodynamics). Catalogue row fep-050; maturity `real` in config/topics.yaml.
    Natural-language anchor for OpenGauss / Hermes sessions and `lake env lean` checks.

    '
  lean_sketch: "import Mathlib.Analysis.SpecialFunctions.Log.Basic\n\nnamespace FEP050\n\n/-- Landauer bound: work ≥ kT ln\
    \ 2 per bit erased (information thermodynamics). -/\nnoncomputable def fep050_landauer_bound (kT : ℝ) : ℝ := kT * Real.log\
    \ 2\n\n/-- Landauer bound is positive at positive temperature. -/\ntheorem fep050_landauer_pos (kT : ℝ) (hT : 0 < kT)\
    \ : 0 < fep050_landauer_bound kT :=\n  mul_pos hT (Real.log_pos (by norm_num : (1 : ℝ) < 2))\n\n/-- Work must exceed Landauer\
    \ bound: W ≥ kT ln 2 implies W - kT ln 2 ≥ 0. -/\ntheorem fep050_excess_work_nonneg (W kT : ℝ) (hW : fep050_landauer_bound\
    \ kT ≤ W) :\n    0 ≤ W - fep050_landauer_bound kT :=\n  sub_nonneg.mpr hW\n\n/-- Erasing n bits costs at least n × kT\
    \ ln 2 (positivity version). -/\ntheorem fep050_n_bits (kT : ℝ) (n : ℕ) (hT : 0 < kT) :\n    0 < n * fep050_landauer_bound\
    \ kT ↔ 0 < n := by\n  constructor\n  · intro h\n    by_contra hle\n    push_neg at hle\n    have : n = 0 := Nat.le_zero.mp\
    \ hle\n    simp [this, fep050_landauer_bound] at h\n  · intro hn\n    exact mul_pos (Nat.cast_pos.mpr hn) (fep050_landauer_pos\
    \ kT hT)\n\n/-- Landauer bound vanishes at zero temperature. -/\ntheorem fep050_zero_temp : fep050_landauer_bound 0 =\
    \ 0 := by\n  simp [fep050_landauer_bound]\n\nend FEP050\n"
  latex_equations:
  - '\begin{aligned}

    &(kT : \mathbb{R}) (hT : 0 < kT) \\

    &0 < fep050_landauer_bound kT

    \end{aligned}'
  - '\begin{aligned}

    &(W kT : \mathbb{R}) (hW : fep050_landauer_bound kT \le W) \\

    &0 \le W - fep050_landauer_bound kT

    \end{aligned}'
  - '\begin{aligned}

    &(kT : \mathbb{R}) (n : \mathbb{N}) (hT : 0 < kT) \\

    &0 < n * fep050_landauer_bound kT \leftrightarrow 0 < n

    \end{aligned}'
  - fep050_landauer_bound 0 = 0
