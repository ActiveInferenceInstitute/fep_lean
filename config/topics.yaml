    namespace FEP042\n\nvariable {α : Type*} [MeasurableSpace α]\n\n/-- Sufficient statistics: measure of preimage is nonneg\
    \ (ENNReal). -/\ntheorem fep042_push_nonneg (μ : MeasureTheory.Measure α) (f : α → ℝ) (s : Set ℝ) :\n    0 ≤ μ (f ⁻¹'\
    \ s) :=\n  zero_le _\n\n/-- Fisher-Neyman: preimage of full codomain is full domain. -/\ntheorem fep042_preimage_univ\
    \ (f : α → ℝ) : f ⁻¹' Set.univ = Set.univ :=\n  Set.preimage_univ\n\n/-- Sufficient statistic map is monotone w.r.t. set\
    \ inclusion. -/\ntheorem fep042_preimage_mono (f : α → ℝ) {s t : Set ℝ} (hst : s ⊆ t) :\n    f ⁻¹' s ⊆ f ⁻¹' t :=\n  Set.preimage_mono\
