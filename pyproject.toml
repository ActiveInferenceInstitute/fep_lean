[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fep_lean"
version = "1.0.0"
description = "FEP Lean4 catalogue, OpenGauss-oriented session model, manuscript artifacts"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.5.0",
    "pytest-httpserver>=1.0.8",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "ruff>=0.15.0",
]

[project.scripts]
fep-lean = "cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["cli", "_paths"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "serial_lean: Lean/lake workspace tests; do not run in parallel with other lean-heavy files (see tests/AGENTS.md)",
]
timeout = 900
timeout_method = "thread"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::pytest.PytestWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/__init__.py"]
# Figure generation uses ``ProcessPoolExecutor`` (spawn); trace worker processes.
concurrency = ["multiprocessing"]

[tool.coverage.report]
# Line coverage ~90%; combined line+branch ~89.6% with current Hermes/network branches.
fail_under = 89

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff.lint]
ignore = [
    "RUF001",  # Ambiguous unicode chars in strings — intentional Lean math notation
    "RUF003",  # Ambiguous unicode chars in comments — same as RUF001
    "BLE001",  # Blind-except — intentional fail-closed design: pipeline stages,
               # environment checks, and Hermes error handling must survive any
               # exception to produce a structured result rather than crash.
    "EXE001",  # Shebang-not-executable — scripts are imported, not directly execed.
]
